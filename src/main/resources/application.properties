spring.application.name=backend

server.port=${SERVER_PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/learne}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:learne}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:learne_dev_password}

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:none}
spring.jpa.open-in-view=false

spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:true}
spring.flyway.locations=classpath:db/migration

spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:false}

app.admin.email=${APP_ADMIN_EMAIL:admin@learne.local}
app.admin.password=${APP_ADMIN_PASSWORD:Admin123}
app.admin.full-name=${APP_ADMIN_FULL_NAME:LearnE Admin}
