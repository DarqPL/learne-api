spring.application.name=backend

server.port=${SERVER_PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/learne}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:learne}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:learne_dev_password}

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:none}
spring.jpa.open-in-view=false

spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:true}
spring.flyway.locations=classpath:db/migration

spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:false}

app.admin.email=${APP_ADMIN_EMAIL:admin@learne.local}
app.admin.password=${APP_ADMIN_PASSWORD:Admin123}
app.admin.full-name=${APP_ADMIN_FULL_NAME:LearnE Admin}

app.auth.jwt-secret=${APP_AUTH_JWT_SECRET:learne-development-jwt-secret-change-me-please-32-bytes-minimum}
app.auth.access-token-ttl=${APP_AUTH_ACCESS_TOKEN_TTL:15m}
app.auth.refresh-token-ttl=${APP_AUTH_REFRESH_TOKEN_TTL:7d}
app.auth.refresh-cookie-name=${APP_AUTH_REFRESH_COOKIE_NAME:refresh_token}
app.auth.refresh-cookie-path=${APP_AUTH_REFRESH_COOKIE_PATH:/api/auth}
app.auth.refresh-cookie-same-site=${APP_AUTH_REFRESH_COOKIE_SAME_SITE:Lax}
app.auth.refresh-cookie-secure=${APP_AUTH_REFRESH_COOKIE_SECURE:false}
