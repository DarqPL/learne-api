spring.application.name=backend

server.port=${SERVER_PORT:8080}
server.forward-headers-strategy=none

app.rate-limit.enabled=${APP_RATE_LIMIT_ENABLED:true}
app.rate-limit.namespace=learne
app.rate-limit.environment=${APP_RATE_LIMIT_ENVIRONMENT:local}
app.rate-limit.hmac-secret=${APP_RATE_LIMIT_HMAC_SECRET:learne-rate-limit-local-test-key-not-for-production}
app.rate-limit.allow-production-bypass=${APP_RATE_LIMIT_ALLOW_PRODUCTION_BYPASS:false}
app.rate-limit.trusted-proxies=${APP_RATE_LIMIT_TRUSTED_PROXIES:}
app.rate-limit.policies.login-ip.dimension=IP
app.rate-limit.policies.login-ip.revision=r1
app.rate-limit.policies.login-ip.capacity=15
app.rate-limit.policies.login-ip.refill-tokens=60
app.rate-limit.policies.login-ip.refill-period=1m
app.rate-limit.policies.register-send-ip.dimension=IP
app.rate-limit.policies.register-send-ip.revision=r1
app.rate-limit.policies.register-send-ip.capacity=10
app.rate-limit.policies.register-send-ip.refill-tokens=30
app.rate-limit.policies.register-send-ip.refill-period=10m
app.rate-limit.policies.register-send-email.dimension=EMAIL
app.rate-limit.policies.register-send-email.revision=r1
app.rate-limit.policies.register-send-email.capacity=1
app.rate-limit.policies.register-send-email.refill-tokens=1
app.rate-limit.policies.register-send-email.refill-period=1m
app.rate-limit.policies.register-verify-ip.dimension=IP
app.rate-limit.policies.register-verify-ip.revision=r1
app.rate-limit.policies.register-verify-ip.capacity=10
app.rate-limit.policies.register-verify-ip.refill-tokens=60
app.rate-limit.policies.register-verify-ip.refill-period=1m
app.rate-limit.policies.password-reset-request-ip.dimension=IP
app.rate-limit.policies.password-reset-request-ip.revision=r1
app.rate-limit.policies.password-reset-request-ip.capacity=10
app.rate-limit.policies.password-reset-request-ip.refill-tokens=30
app.rate-limit.policies.password-reset-request-ip.refill-period=10m
app.rate-limit.policies.password-reset-request-email.dimension=EMAIL
app.rate-limit.policies.password-reset-request-email.revision=r1
app.rate-limit.policies.password-reset-request-email.capacity=1
app.rate-limit.policies.password-reset-request-email.refill-tokens=1
app.rate-limit.policies.password-reset-request-email.refill-period=1m
app.rate-limit.policies.password-reset-confirm-ip.dimension=IP
app.rate-limit.policies.password-reset-confirm-ip.revision=r1
app.rate-limit.policies.password-reset-confirm-ip.capacity=10
app.rate-limit.policies.password-reset-confirm-ip.refill-tokens=60
app.rate-limit.policies.password-reset-confirm-ip.refill-period=1m

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/learne}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:learne}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:learne_dev_password}

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:none}
spring.jpa.open-in-view=false

spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:true}
spring.flyway.locations=classpath:db/migration

spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=${MAIL_SMTP_CONNECTION_TIMEOUT_MS:5000}
spring.mail.properties.mail.smtp.timeout=${MAIL_SMTP_READ_TIMEOUT_MS:15000}
spring.mail.properties.mail.smtp.writetimeout=${MAIL_SMTP_WRITE_TIMEOUT_MS:15000}
app.mail.delivery-deadline-ms=${APP_MAIL_DELIVERY_DEADLINE_MS:45000}
app.mail.from=${MAIL_FROM:}

app.admin.email=${APP_ADMIN_EMAIL:admin@learne.local}
app.admin.password=${APP_ADMIN_PASSWORD:Admin123}
app.admin.full-name=${APP_ADMIN_FULL_NAME:LearnE Admin}

app.auth.jwt-secret=${APP_AUTH_JWT_SECRET:learne-development-jwt-secret-change-me-please-32-bytes-minimum}
app.auth.access-token-ttl=${APP_AUTH_ACCESS_TOKEN_TTL:15m}
app.auth.refresh-token-ttl=${APP_AUTH_REFRESH_TOKEN_TTL:7d}
app.auth.refresh-cookie-name=${APP_AUTH_REFRESH_COOKIE_NAME:refresh_token}
app.auth.refresh-cookie-path=${APP_AUTH_REFRESH_COOKIE_PATH:/api/auth}
app.auth.refresh-cookie-same-site=${APP_AUTH_REFRESH_COOKIE_SAME_SITE:Lax}
app.auth.refresh-cookie-secure=${APP_AUTH_REFRESH_COOKIE_SECURE:false}

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:}

app.monetization.plans.vip-price-vnd=${APP_MONETIZATION_PLANS_VIP_PRICE_VND:200000}
app.monetization.plans.pro-price-vnd=${APP_MONETIZATION_PLANS_PRO_PRICE_VND:500000}
app.monetization.plans.pro-plus-price-vnd=${APP_MONETIZATION_PLANS_PRO_PLUS_PRICE_VND:350000}

app.ai-service.base-url=${AI_SERVICE_URL:http://ai-service:5000}
app.ai-service.timeout-ms=${AI_SERVICE_TIMEOUT_MS:8000}
app.ai-service.enabled=${AI_SERVICE_ENABLED:true}
app.ai-service.internal-token=${AI_SERVICE_INTERNAL_TOKEN:}

app.course-enrichment.timeout-ms=${COURSE_ENRICHMENT_TIMEOUT_MS:120000}
app.course-enrichment.connect-timeout-ms=${COURSE_ENRICHMENT_CONNECT_TIMEOUT_MS:5000}
app.course-enrichment.max-in-flight=${COURSE_ENRICHMENT_MAX_IN_FLIGHT:2}

app.cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
app.cloudinary.api-key=${CLOUDINARY_API_KEY:}
app.cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
app.cloudinary.profile-folder=${CLOUDINARY_PROFILE_FOLDER:learne/teacher-profiles}
app.cloudinary.max-avatar-bytes=${CLOUDINARY_MAX_AVATAR_BYTES:5242880}
app.cloudinary.max-video-bytes=${CLOUDINARY_MAX_VIDEO_BYTES:104857600}

spring.servlet.multipart.max-file-size=${SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE:100MB}
spring.servlet.multipart.max-request-size=${SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE:100MB}

app.cache.redis.enabled=${APP_CACHE_REDIS_ENABLED:true}
app.cache.redis.key-prefix=${APP_CACHE_REDIS_KEY_PREFIX:learne}
app.cache.redis.ttl-jitter-percent=${APP_CACHE_REDIS_TTL_JITTER_PERCENT:10}
app.cache.ttl.student-catalog=${APP_CACHE_TTL_STUDENT_CATALOG:5m}
app.cache.ttl.student-course-detail=${APP_CACHE_TTL_STUDENT_COURSE_DETAIL:5m}
app.cache.ttl.student-dashboard=${APP_CACHE_TTL_STUDENT_DASHBOARD:60s}
app.cache.ttl.teacher-dashboard=${APP_CACHE_TTL_TEACHER_DASHBOARD:60s}
app.cache.ttl.admin-dashboard=${APP_CACHE_TTL_ADMIN_DASHBOARD:60s}
app.cache.ttl.leaderboard=${APP_CACHE_TTL_LEADERBOARD:5m}
app.cache.ttl.teacher-public=${APP_CACHE_TTL_TEACHER_PUBLIC:10m}
app.cache.ttl.course-access=${APP_CACHE_TTL_COURSE_ACCESS:120s}

spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
spring.data.redis.password=${SPRING_DATA_REDIS_PASSWORD:}
spring.data.redis.timeout=${SPRING_DATA_REDIS_TIMEOUT:2s}

management.endpoints.web.exposure.include=${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:health,metrics}
management.endpoint.health.show-details=${MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS:never}

spring.jpa.properties.hibernate.generate_statistics=${HIBERNATE_GENERATE_STATISTICS:false}
logging.level.org.hibernate.stat=${HIBERNATE_STAT_LOG_LEVEL:WARN}
logging.level.org.hibernate.SQL=${HIBERNATE_SQL_LOG_LEVEL:WARN}
app.jobs.worker-enabled=${APP_JOBS_WORKER_ENABLED:true}
# C7 supplies the real terminalization port; C8 owns public async API activation.
app.jobs.course-submission-enabled=${APP_JOBS_COURSE_SUBMISSION_ENABLED:true}
app.job-crypto.active-key-id=${APP_JOB_CRYPTO_ACTIVE_KEY_ID:}
app.job-crypto.keys-json=${APP_JOB_CRYPTO_KEYS:}
app.frontend-base-url=${APP_FRONTEND_BASE_URL:http://localhost:5173}
# Mail renderer uses the same single trusted frontend URI.
app.mail.frontend-base-url=${app.frontend-base-url}
# Renewal I/O bounds: pool acquisition 5s, PostgreSQL connect/read 5s, cancellation connection 2s.
# JobStore heartbeat also sets a 5s transaction/JDBC statement timeout; no shared template mutation.
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.validation-timeout=2000
spring.datasource.hikari.data-source-properties.connectTimeout=5
spring.datasource.hikari.data-source-properties.socketTimeout=5
spring.datasource.hikari.data-source-properties.cancelSignalTimeout=2
