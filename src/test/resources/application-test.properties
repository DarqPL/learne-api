spring.datasource.url=jdbc:h2:mem:learne_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=none
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration-h2
app.jobs.worker-enabled=false
app.job-crypto.active-key-id=test-v1
app.job-crypto.keys-json={"test-v1":"MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY="}
app.ai-service.base-url=${AI_SERVICE_URL:http://ai-service:5000}
app.ai-service.timeout-ms=${AI_SERVICE_TIMEOUT_MS:8000}
app.ai-service.enabled=${AI_SERVICE_ENABLED:true}
app.ai-service.internal-token=${AI_SERVICE_INTERNAL_TOKEN:}
app.cache.redis.enabled=false
app.cache.redis.key-prefix=learne-test
app.rate-limit.enabled=false
